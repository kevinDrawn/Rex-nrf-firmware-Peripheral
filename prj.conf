# ESB CONFIG
CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_ESB=y
# Payload: unilateral EMG = 24 bytes, bilateral EMG = 36 bytes.
CONFIG_ESB_MAX_PAYLOAD_LENGTH=36
CONFIG_DK_LIBRARY=y
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=40

# SAADC
CONFIG_ADC=n
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_GPPI=y
CONFIG_NRFX_TIMER1=y

# Mode
CONFIG_HALL_MODE=y
CONFIG_CAN_MODE=y
CONFIG_EMG_MODE=y
# Select exactly one EMG mode. For bilateral, switch these two lines.
CONFIG_EMG_UNILATERAL=n
# CONFIG_EMG_BILATERAL is not set
CONFIG_EMG_BILATERAL=y

#GPIO
CONFIG_GPIO=y

# ==============================
# UART Async Binary Streaming
# ==============================
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_NRFX_UARTE0=y   # UART0 활성화 (필요 시)

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# =========================
# RTT Debug Log
# =========================
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n

# Sensor 
CONFIG_SPI=y
CONFIG_SENSOR=y
